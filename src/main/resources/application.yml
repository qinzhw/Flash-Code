spring:
  application:
    name: flash-code
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/flash_code
    username: root
    password: root
  profiles:
    active: local

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.example.flashcode.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

